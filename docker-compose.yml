services:
  # ── Portalcrane Application ──────────────────────────────────────────────
  portalcrane:
    image: ghcr.io/cyr-ius/portalcrane:latest
    container_name: portalcrane
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      # ── Registry configuration ────────────────────────────────────────────
      - REGISTRY_PROXY_AUTH_ENABLED=${REGISTRY_PROXY_AUTH_ENABLED:-true}

      # ── Admin credentials ─────────────────────────────────────────────────
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      # The admin password is always auto-generated: a one-time password is
      # printed in the logs on first start.

      # ── JWT (optional) ────────────────────────────────────────────────────
      # Leave SECRET_KEY unset to auto-generate and persist one under DATA_DIR.
      - SECRET_KEY=${SECRET_KEY:-}

      # ── Logging ───────────────────────────────────────────────────────────
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-false}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}

    volumes:
      - portalcrane_data:/var/lib/portalcrane

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  portalcrane_data:
